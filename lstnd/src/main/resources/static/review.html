<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>review</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div id="albumInfo">
            <h2>loading...</h2>
        </div>
        <div class="reviewBox">
            <div class="reviewInfo">
                <input type="text" id="namebox" placeholder="Insert your username">
            <div class="rating">
                <div class="star" data-score="1">☆</div>
                <div class="star" data-score="2">☆</div>
                <div class="star" data-score="3">☆</div>
                <div class="star" data-score="4">☆</div>
                <div class="star" data-score="5">☆</div>
            </div>
            </div>
            <textarea name="review" id="review" placeholder="Write your review"></textarea>
            <button id="send">Send review</button>
        </div>
        <div id="reviews"></div>
    </main>
    <script src="review.js"></script>
</body>
</html>
